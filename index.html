<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRÉSTAMO CLARO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <!-- PANTALLA DE LOGIN Y BLOQUEO -->
  <div id="loginContainer" class="auth-container">
    <div class="auth-box">
      <h2 id="authTitle">Iniciar Sesión</h2>
      <p id="authSubtitle">Ingresa tus credenciales para acceder al sistema.</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="usuario@ejemplo.com">
        </div>

        <div class="input-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>

        <button type="submit" id="btnLogin">Ingresar</button>
      </form>

      <div id="authError" class="auth-error" style="display: none;"></div>
    </div>
  </div>

  <!-- CONTENIDO COMPLETO DE TU APLICACIÓN (Oculto por defecto) -->
  <div id="appContent" style="display: none;">
    
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">$</div>
          <div>
            <h1>PRÉSTAMO CLARO</h1>
            <small id="today"></small>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-link active" data-view="dashboard">
            <span class="icon">📊</span> Resumen
          </button>
          <button class="nav-link" data-view="receivables">
            <span class="icon">⌛</span> Cuentas por cobrar
          </button>
          <button class="nav-link" data-view="calendar">
            <span class="icon">📅</span> Agenda de pagos
          </button>
          <button class="nav-link" data-view="loans">
            <span class="icon">📝</span> Préstamos y facturas
          </button>
          <button class="nav-link" data-view="clients">
            <span class="icon">👥</span> Clientes
          </button>
          <button class="nav-link" data-view="history">
            <span class="icon">📜</span> Historial de pagos
          </button>
          <button class="nav-link" data-view="backup">
            <span class="icon">💾</span> Copias de seguridad
          </button>
        </nav>

        <!-- BOTÓN DE CERRAR SESIÓN EN LA BARRA LATERAL -->
        <div style="padding: 15px; margin-top: auto;">
          <button onclick="cerrarSesion()" style="width: 100%; background-color: #d9534f; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">
            🚪 Cerrar Sesión
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton">☰</button>
          <h2 id="pageTitle">Resumen</h2>
        </header>

        <div class="content" id="view"></div>
      </main>
    </div>

    <div id="modalRoot"></div>
    <input type="file" id="restoreInput" accept="application/json" style="display:none">

  </div>

  <!-- SDK DE SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- TU ARCHIVO JS PRINCIPAL -->
  <script src="app.js?v=3"></script>
</body>
</html>
