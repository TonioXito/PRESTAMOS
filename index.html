<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Préstamos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>

  <!-- PANTALLA DE LOGIN Y BLOQUEO -->
  <div id="loginContainer" class="auth-container">
    <div class="auth-box">
      <h2 id="authTitle">Iniciar Sesión</h2>
      <p id="authSubtitle">Ingresa tus credenciales para acceder al sistema.</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="usuario@ejemplo.com">
        </div>

        <div class="input-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>

        <button type="submit" id="btnLogin">Ingresar</button>
      </form>

      <div id="authError" class="auth-error" style="display: none;"></div>
    </div>
  </div>

  <!-- CONTENIDO ORIGINAL DE TU APLICACIÓN (Oculto por defecto) -->
  <div id="appContent" style="display: none;">
    
    <!-- AQUÍ VA TODO EL CONTENIDO ORIGINAL QUE YA TIENES DENTRO DEL BODY DE INDEX.HTML -->

    <div style="text-align: right; padding: 10px;">
      <button onclick="cerrarSesion()" style="background-color: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
        Cerrar Sesión
      </button>
    </div>
  </div>

  <!-- SDK DE SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- TU ARCHIVO JS PRINCIPAL -->
  <script src="app.js"></script>
</body>
</html>
